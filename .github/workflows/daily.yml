name: daily-pipeline

# Beijing 05:40 Tue–Sat  ==  UTC 21:40 Mon–Fri
on:
  schedule:
    - cron: "40 21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write   # commit state (trader.db / JSON) back to the repo

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      # fetch-heavy steps are fault-tolerant: one bad source must not
      # block the rest of the chain or the state commit
      - name: options daily signals
        continue-on-error: true
        run: python -m engine.daily_signals --no-sync

      - name: stock paper (daily bars)
        continue-on-error: true
        run: python -m engine.stock_paper --no-sync --top 20

      - name: 1h paper replay
        continue-on-error: true
        run: python -m engine.intraday_paper

      - name: sync to Supabase
        continue-on-error: true
        run: python -m engine.sync

      - name: export frontend JSON
        run: python -m engine.export_web

      - name: commit state back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/trader.db data/*.json web/public/data/
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "daily pipeline $(date -u +%F)"
            git push
          fi
